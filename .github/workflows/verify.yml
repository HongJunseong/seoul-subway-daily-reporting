name: Verify data contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements/dev.txt
      - run: ruff check src dags scripts tests
      - run: pytest -q --ignore=tests/test_dags.py
      - run: python scripts/demo.py --output-dir .work/demo/ci
      - run: python scripts/recovery_experiment.py --output-dir .work/recovery/ci
      - uses: actions/upload-artifact@v4
        with:
          name: offline-pipeline-evidence
          path: |
            .work/demo/ci
            .work/recovery/ci
          retention-days: 7
  dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.work/airflow
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install apache-airflow==2.7.3 --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.7.3/constraints-3.11.txt
      - run: pip install pytest==8.4.2
      - run: pytest -q tests/test_dags.py
