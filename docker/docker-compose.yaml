# Local single-node portfolio environment; no external calls until DAGs are unpaused.
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: '${AIRFLOW_WEBSERVER_SECRET_KEY:-local-development-only}'
    PYTHONPATH: /opt/airflow
    SSDR_REPORT_MODE: template
  env_file:
    - ../.env
  volumes:
    - ../dags:/opt/airflow/dags:ro
    - ../src:/opt/airflow/src:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-reports:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped
  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command: ["-c", "mkdir -p /opt/airflow/logs /opt/airflow/data && chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/logs /opt/airflow/data && exec /entrypoint bash -c 'airflow pools set ssdr_delta_writer 1 serialize_delta_writers && airflow version'"]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-db-volume:
  airflow-logs:
  airflow-reports:
