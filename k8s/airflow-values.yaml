# Local Kubernetes portfolio profile. Build this image from the reviewed checkout.
airflowVersion: '2.7.3'
defaultAirflowTag: '2.7.3'
multiNamespaceMode: false
executor: KubernetesExecutor
images:
  airflow:
    repository: ssdr-airflow
    tag: portfolio-v2
    pullPolicy: Never
  pod_template:
    repository: ssdr-airflow
    tag: portfolio-v2
    pullPolicy: Never
extraEnvFrom: |
  - secretRef:
      name: ssdr-secrets
env:
  - name: PYTHONPATH
    value: /opt/airflow
  - name: SSDR_STORAGE_PREFIX
    value: v2
  - name: SSDR_REPORT_MODE
    value: template
  - name: SSDR_TASK_POD_PROFILES
    value: 'true'
config:
  core:
    parallelism: 2
    max_active_tasks_per_dag: 2
dags:
  gitSync:
    enabled: false
webserver:
  service:
    type: NodePort
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
        nodePort: 30080
workers:
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 1Gi
postgresql:
  enabled: false
data:
  metadataSecretName: ssdr-metadata
redis:
  enabled: false
logs:
  persistence:
    enabled: true
    size: 5Gi
