# Local Kubernetes portfolio profile. Build this image from the reviewed checkout.
executor: KubernetesExecutor
images:
  airflow:
    repository: ssdr-airflow
    tag: portfolio-v2
    pullPolicy: Never
extraEnvFrom: |
  - secretRef:
      name: ssdr-secrets
env:
  - name: PYTHONPATH
    value: /opt/airflow
  - name: SSDR_STORAGE_PREFIX
    value: v2
  - name: SSDR_REPORT_MODE
    value: template
config:
  core:
    parallelism: 2
    max_active_tasks_per_dag: 2
dags:
  gitSync:
    enabled: false
webserver:
  service:
    type: NodePort
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
        nodePort: 30080
workers:
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
postgresql:
  enabled: true
redis:
  enabled: false
logs:
  persistence:
    enabled: true
    size: 5Gi
